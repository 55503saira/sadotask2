apiVersion: apps/v1
kind: Deployment
metadata:
  name: your-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: StudentApp
  template:
    metadata:
      labels:
        app: StudentApp
    spec:
      containers:
        - name: StudentApp
          image: sadotask:version1
          imagePullPolicy: Never   # Critical: use local image
          ports:
            - containerPort: 8080 # Modify according to your app port
