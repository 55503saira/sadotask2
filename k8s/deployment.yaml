apiVersion: apps/v1
kind: Deployment
metadata:
  name: your-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studentapp
  template:
    metadata:
      labels:
        app: studentapp
    spec:
      containers:
        - name: studentapp
          image: sadotask:version1
          imagePullPolicy: Never
          ports:
            - containerPort: 8081          # Metro listens here
          env:
            - name: EXPO_PACKAGER_PROXY_URL
              value: "http://0.0.0.0:8081"
          args: ["npx", "expo", "start", "--host", "lan", "--port", "8081"]
